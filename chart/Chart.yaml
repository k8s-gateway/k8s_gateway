apiVersion: v2
name: k8s-gateway
description: A Helm chart for the k8s_gateway CoreDNS plugin
type: application
version: 4.0.0
appVersion: 1.9.0
home: https://codeberg.org/k8s-gateway/k8s_gateway
sources:
  - https://github.com/k8s-gateway/k8s_gateway
  - https://codeberg.org/k8s-gateway/k8s_gateway
maintainers:
  - url: https://codeberg.org/kryptonian
    name: kryptonian
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: Reworked the chart around configurable server and plugin definitions, with expanded deployment, service, pod, and security settings.
    - kind: added
      description: Added optional HorizontalPodAutoscaler, PodDisruptionBudget, and Prometheus ServiceMonitor resources.
    - kind: changed
      description: Updated RBAC generation to follow configured resources and added permissions for EndpointSlices, ListenerSets, and required get operations.
    - kind: changed
      description: Improved configurable ports, protocols, health probes, annotations, labels, extra volumes, secrets, containers, and zone files.
    - kind: changed
      description: Refreshed chart tests and documentation for the new chart configuration.
