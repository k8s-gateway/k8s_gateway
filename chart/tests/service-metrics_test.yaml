# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Metrics Service Rendering Test

templates:
  - templates/service-metrics.yaml

set:
  deployment:
    enabled: true
  prometheus:
    service:
      enabled: true
      annotations:
        prometheus.io/scrape: "true"
    monitor:
      enabled: false
  servers:
    - zones:
        - zone: .
      port: 53
      plugins:
        - name: prometheus
          parameters: 0.0.0.0:9553

release:
  name: test-release
  namespace: test-ns

tests:
  - it: should expose the configured Prometheus port
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-release-k8s-gateway-metrics
      - equal:
          path: metadata.namespace
          value: test-ns
      - equal:
          path: metadata.annotations["prometheus.io/port"]
          value: "9553"
      - equal:
          path: spec.ports[0].name
          value: metrics
      - equal:
          path: spec.ports[0].port
          value: 9553
      - equal:
          path: spec.ports[0].targetPort
          value: 9553
