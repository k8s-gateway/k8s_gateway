{{- if and .Values.deployment.enabled .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ template "k8s-gateway.clusterRoleName" . }}
  labels: {{- include "k8s-gateway.labels" . | nindent 4 }}
{{- with .Values.customAnnotations }}
  annotations:
{{- toYaml . | nindent 4 }}
{{- end }}
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch

  {{- if eq (include "k8s-gateway.service" .) "true" }}
  - apiGroups:
      - ""
    resources:
      - services
      - namespaces
    verbs:
      - list
      - watch
  {{- end }}

  {{- if eq (include "k8s-gateway.ingress" .) "true" }}
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - list
      - watch
  {{- end }}

  {{- if or (eq (include "k8s-gateway.httpRoute" .) "true") (eq (include "k8s-gateway.tlsRoute" .) "true") (eq (include "k8s-gateway.grpcRoute" .) "true") }}
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
      - gatewayclasses
      {{- if eq (include "k8s-gateway.httpRoute" .) "true" }}
      - httproutes
      {{- end }}
      {{- if eq (include "k8s-gateway.tlsRoute" .) "true" }}
      - tlsroutes
      {{- end }}
      {{- if eq (include "k8s-gateway.grpcRoute" .) "true" }}
      - grpcroutes
      {{- end }}
    verbs:
      - watch
      - list
  {{- end }}

  {{- if eq (include "k8s-gateway.dnsEndpoint" .) "true" }}
  - apiGroups:
      - externaldns.k8s.io
    resources:
      - dnsendpoints
    verbs:
      - get
      - watch
      - list
  - apiGroups:
      - externaldns.k8s.io
    resources:
      - dnsendpoints/status
    verbs:
      - "*"
  {{- end }}

  {{- if eq (include "k8s-gateway.node" .) "true" }}
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
      - watch
  {{- end }}
{{- end }}