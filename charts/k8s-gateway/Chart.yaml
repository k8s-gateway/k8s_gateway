apiVersion: v2
name: k8s-gateway
description: A Helm chart for the k8s_gateway CoreDNS plugin with CoreDNS-style server/plugin configuration
type: application
version: 4.0.0
appVersion: 1.8.0
home: https://github.com/k8s-gateway/k8s_gateway
sources:
  - https://github.com/k8s-gateway/k8s_gateway
maintainers:
  - url: https://github.com/samip5
    name: samip5
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: refactored to CoreDNS-style server/plugin configuration
    - kind: added
      description: HPA support
    - kind: added
      description: ServiceMonitor support
    - kind: added
      description: PodDisruptionBudget support
    - kind: added
      description: dynamic port generation from server definitions
    - kind: added
      description: multi-protocol support (DNS, DoT, DoH, gRPC)
