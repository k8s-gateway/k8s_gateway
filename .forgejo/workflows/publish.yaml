name: Pages
on:
  push:
    branches: ["pages"]
  workflow_dispatch:

jobs:
 publish:
  runs-on: codeberg-tiny
  steps:
   - uses: actions/checkout@v7
   - uses: https://codeberg.org/git-pages/action@v2
     with:
      site: https://k8s-gateway.kryptonian.kapsi.fi/
      server: codeberg.page
      token: ${{ forge.token }}
      source: .
