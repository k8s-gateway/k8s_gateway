name: "Charts: Release"

concurrency: helm-release

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
    paths:
      - "chart/**"

jobs:
  release-chart:
    name: Release chart
    # Grants the invoked reusable workflow's jobs OIDC token issuance
    # (Forgejo's equivalent of GitHub's `permissions: id-token: write`).
    enable-openid-connect: true
    uses: ./.forgejo/workflows/chart-release-steps.yaml
    with:
      createRelease: true
      publishToPages: true
      publishToOciRegistry: true
