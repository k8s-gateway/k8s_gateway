# Adapted from the GitHub version:
#  - GitHub Pages (artifact upload + actions/deploy-pages) replaced with a
#    plain push to a "pages" branch, which is how Codeberg Pages serves
#    project sites directly from git — BUT Codeberg also requires a one-time
#    manual webhook (repo Settings > Webhooks, type "Forgejo", branch filter
#    "pages") pointing at the Codeberg Pages server before pushes to that
#    branch actually trigger a (re)deploy. Pushing alone does not do it.
#  - GitHub Releases (EndBug/latest-tag + ncipollo/release-action) replaced
#    with a plain git tag push + code.forgejo.org's forgejo-release action
#    (inputs verified against its action.yml as of this writing).
#  - OIDC uses Forgejo's own `enable-openid-connect: true` (not GitHub's
#    `permissions: id-token: write`, which Forgejo does not honor for this
#    purpose) and the issuer is `<instance>/api/actions` per Forgejo's OIDC
#    docs. Verified 2026-09: the public-good Sigstore Fulcio instance does NOT
#    trust Codeberg's issuer (Fulcio 400), so chart signing is key-based via
#    the optional COSIGN_PRIVATE_KEY/COSIGN_PASSWORD secrets instead.
#  - Registry and release auth use a JWT minted from the OIDC token, via an
#    Authorized Integration with package + repository write. Publish its
#    audience as the CHART_RELEASE_AUDIENCE variable; without it this falls
#    back to a REGISTRY_TOKEN PAT, since the per-job token has no package scope.
enable-openid-connect: true
name: "Release chart (Reusable)"

on:
  workflow_call:
    inputs:
      createRelease:
        description: >
          Should the chart be published as a Forgejo/Codeberg release
        default: false
        required: false
        type: boolean
      publishToPages:
        description: >
          Should the charts be published to Codeberg Pages.
        default: false
        required: false
        type: boolean
      publishToOciRegistry:
        description: >
          Should the charts be published to an OCI registry.
        default: false
        required: false
        type: boolean

jobs:
  release-chart:
    name: Release chart
    runs-on: docker

    steps:
      - name: Checkout source branch
        uses: https://code.forgejo.org/actions/checkout@v7
        with:
          path: src

      - name: Install Mise and required tools
        uses: https://github.com/jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: src/chart

      - name: Mint chart release JWT
        id: jwt
        env:
          AUD: ${{ vars.CHART_RELEASE_AUDIENCE }}
        run: |
          [ -n "${AUD}" ] || exit 0
          jwt=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')
          echo "::add-mask::${jwt}"
          echo "jwt=${jwt}" >> "$GITHUB_OUTPUT"

      - name: Login to OCI Registry
        if: ${{ success() && inputs.publishToOciRegistry }}
        uses: https://github.com/docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: codeberg.org
          username: ${{ github.actor }}
          password: ${{ steps.jwt.outputs.jwt || secrets.REGISTRY_TOKEN }}

      - name: Get chart details
        id: chart-details
        uses: https://github.com/bjw-s-labs/helm-charts-actions/get-chart-details@4f48dbc7967b9c73c1a1f72db82de8de9274a626
        with:
          path: src/chart
          validateChartYaml: true
          requireChangelog: true

      # NOTE: no `working-directory:` on any run step — the k8s runner plugin
      # silently ignores it (steps run at the workspace root regardless), so
      # every path below is explicit relative to the workspace.
      - name: Check for existing release
        id: version-check
        shell: bash
        env:
          TAG: "${{ steps.chart-details.outputs.name }}-${{ steps.chart-details.outputs.version }}"
        run: |
          if git -C src ls-remote --exit-code --tags origin "refs/tags/${TAG}"; then
            echo "::warning::Version ${TAG} already exists remotely, skipping publish steps."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing OCI artifact
        id: oci-version-check
        if: ${{ success() && inputs.publishToOciRegistry }}
        shell: bash
        env:
          CHART_TAG_BASE: codeberg.org/k8s-gateway/charts
          CHART_NAME: ${{ steps.chart-details.outputs.name }}
          CHART_VERSION: ${{ steps.chart-details.outputs.version }}
        run: |
          if helm pull "oci://${CHART_TAG_BASE}/${CHART_NAME}" --version "${CHART_VERSION}" --destination "${RUNNER_TEMP}/oci-check" > /dev/null 2>&1; then
            echo "::warning::OCI artifact ${CHART_NAME}:${CHART_VERSION} already exists, skipping OCI publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Format changelog
        id: format-changelog
        uses: https://github.com/actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUTS_CHANGES: ${{ steps.chart-details.outputs.changes }}
        with:
          script: |
            let input = process.env.INPUTS_CHANGES ?? '';
            let changelog = "## Changelog:";
            let inputParsed = JSON.parse(input);

            var changelogGrouped = inputParsed.reduce((result, currentValue) => {
              (result[currentValue['kind']] = result[currentValue['kind']] || []).push(currentValue);
              return result;
            }, {});

            for (const key in changelogGrouped) {
              changelog = changelog + `\n### ${key[0].toUpperCase() + key.slice(1)}`;
              let entries = changelogGrouped[key];

              entries.forEach(function (entry) {
                changelog = changelog + `\n- ${entry.description}`;
                if ('links' in entry) {
                  entry.links.forEach(function (link) {
                    changelog = changelog + `\n  - [${link.name}](${link.url})`;
                  });
                }
              });
              changelog = changelog + `\n`;
            }
            core.setOutput('changelog', changelog);

      - name: Dereference JSON schema before packaging
        uses: https://github.com/bjw-s-labs/helm-charts-actions/dereference-json-schema@4f48dbc7967b9c73c1a1f72db82de8de9274a626
        with:
          schemaFile: "src/chart/values.schema.json"
          outputFile: "src/chart/values.schema.json"
          allowFileNotFound: true

      - name: Package Helm Chart
        id: package-chart
        shell: bash
        env:
          CHART_DIR: "src/chart"
          TARGET_DIR: "${{ runner.temp }}/charts_out"
        run: |
          mkdir -p "${TARGET_DIR}"
          helm package "${CHART_DIR}" --dependency-update --destination "${TARGET_DIR}"
          echo "result=$(ls ${TARGET_DIR}/*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Checkout pages branch
        uses: https://code.forgejo.org/actions/checkout@v7
        if: ${{ success() && inputs.publishToPages }}
        with:
          path: pages
          ref: pages

      - name: Check for existing package in pages
        id: pages-version-check
        if: ${{ success() && inputs.publishToPages }}
        shell: bash
        env:
          PACKAGE_FILE: ${{ steps.package-chart.outputs.result }}
        run: |
          if [ -f "pages/$(basename "${PACKAGE_FILE}")" ]; then
            echo "::warning::$(basename "${PACKAGE_FILE}") already exists in pages branch, skipping pages publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy package to pages structure
        id: copy-package
        if: ${{ success() && inputs.publishToPages && steps.pages-version-check.outputs.exists != 'true' }}
        shell: bash
        env:
          PACKAGE_FILE: ${{ steps.package-chart.outputs.result }}
        run: |
          cp -v "${PACKAGE_FILE}" "pages/"
          ls -al "pages/"

      - name: Update Helm chart index
        if: ${{ success() && inputs.publishToPages && steps.pages-version-check.outputs.exists != 'true' }}
        shell: bash
        run: |
          helm repo index pages --url https://k8s-gateway.kryptonian.kapsi.fi

      - name: Commit and push changes
        if: ${{ success() && inputs.publishToPages && steps.pages-version-check.outputs.exists != 'true' }}
        uses: https://github.com/stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "feat: Add Chart package ${{ steps.chart-details.outputs.name }}-${{ steps.chart-details.outputs.version }}"
          repository: pages
          branch: pages
          file_pattern: "index.yaml *.tgz"
          commit_user_name: forgejo-actions
          commit_user_email: forgejo-actions@noreply.codeberg.org
          commit_author: forgejo-actions <forgejo-actions@noreply.codeberg.org>

      - name: Create tag
        if: ${{ success() && inputs.createRelease && steps.version-check.outputs.exists != 'true' }}
        shell: bash
        run: |
          TAG="${{ steps.chart-details.outputs.name }}-${{ steps.chart-details.outputs.version }}"
          git -C src tag "$TAG"
          git -C src push origin "$TAG"

      # Deliberately independent of `version-check` (tag existence): the tag
      # and the release are created by separate steps that can fail
      # independently (see the k8s-gateway-3.7.3 incident, 2026-09-08, where
      # the tag push succeeded but the release step died mid-upload and left
      # a stuck draft). Gating release creation on tag existence meant a
      # re-run could never retry just the release once the tag was in place.
      - name: Check for existing release
        id: release-check
        if: ${{ success() && inputs.createRelease }}
        shell: bash
        env:
          TAG: "${{ steps.chart-details.outputs.name }}-${{ steps.chart-details.outputs.version }}"
          TOKEN: ${{ steps.jwt.outputs.jwt || secrets.GITHUB_TOKEN }}
        run: |
          TAG_URL=$(echo "$TAG" | sed 's/\//%2F/g')
          status=$(curl -sS -o release.json -w '%{http_code}' \
            -H "Authorization: token ${TOKEN}" \
            "https://codeberg.org/api/v1/repos/${{ github.repository }}/releases/tags/${TAG_URL}")
          if [ "$status" = "200" ] && [ "$(jq -r .draft <release.json)" = "false" ]; then
            echo "::warning::Release ${TAG} already exists and is published, skipping release creation."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release for tag
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        if: ${{ success() && inputs.createRelease && steps.release-check.outputs.exists != 'true' }}
        with:
          direction: upload
          url: https://codeberg.org
          repo: ${{ github.repository }}
          token: ${{ steps.jwt.outputs.jwt || secrets.GITHUB_TOKEN }}
          tag: ${{ steps.chart-details.outputs.name }}-${{ steps.chart-details.outputs.version }}
          release-notes: ${{ steps.format-changelog.outputs.changelog }}
          hide-archive-link: true
          skip-assets: true
          override: true

      # cosign comes from mise (chart/.mise.tools) — the cosign-installer
      # action needs envsubst, which the runner image lacks.
      # Signing is key-based: the public-good Sigstore Fulcio instance does not
      # trust Codeberg's OIDC issuer (verified against fulcio's identity
      # config, 2026-09), so keyless signing gets "Fulcio returned 400".
      # Generate a keypair with `cosign generate-key-pair` and store the
      # private key + password as COSIGN_PRIVATE_KEY / COSIGN_PASSWORD
      # secrets; signing is skipped when they are absent.
      - name: Push Helm charts to OCI registry
        if: ${{ success() && inputs.publishToOciRegistry && steps.oci-version-check.outputs.exists != 'true' }}
        shell: bash
        env:
          PACKAGE_FILE: ${{ steps.package-chart.outputs.result }}
          CHART_NAME: ${{ steps.chart-details.outputs.name }}
          CHART_VERSION: ${{ steps.chart-details.outputs.version }}
          CHART_TAG_BASE: codeberg.org/k8s-gateway/charts
          CHART_TAG: ${{ steps.chart-details.outputs.name }}:${{ steps.chart-details.outputs.version }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |-
          helm push "${PACKAGE_FILE}" oci://${CHART_TAG_BASE} &> push-metadata.txt
          cat push-metadata.txt
          CHART_DIGEST=$(awk '/Digest: /{print $2}' push-metadata.txt)
          if [ -n "${COSIGN_PRIVATE_KEY}" ]; then
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
              "${CHART_TAG_BASE}/${CHART_TAG}@${CHART_DIGEST}"
          else
            echo "::notice::COSIGN_PRIVATE_KEY secret not set, skipping chart signing."
          fi
