# Adapted from the GitHub version:
#  - GitHub Pages (artifact upload + actions/deploy-pages) replaced with a
#    plain push to a "pages" branch, which is how Codeberg Pages serves
#    project sites directly from git — BUT Codeberg also requires a one-time
#    manual webhook (repo Settings > Webhooks, type "Forgejo", branch filter
#    "pages") pointing at the Codeberg Pages server before pushes to that
#    branch actually trigger a (re)deploy. Pushing alone does not do it.
#  - GitHub Releases (EndBug/latest-tag + ncipollo/release-action) replaced
#    with a plain git tag push + code.forgejo.org's forgejo-release action
#    (inputs verified against its action.yml as of this writing).
#  - OIDC uses Forgejo's own `enable-openid-connect: true` (not GitHub's
#    `permissions: id-token: write`, which Forgejo does not honor for this
#    purpose) and the issuer is `<instance>/api/actions` per Forgejo's OIDC
#    docs. Whether Codeberg's OIDC issuer is trusted by the public-good
#    Sigstore Fulcio/Rekor instances is still unverified — test this
#    end-to-end before depending on it, or switch to key-based cosign signing.
#  - Registry auth uses a dedicated REGISTRY_TOKEN secret: the automatic
#    per-job token does not carry package read/write scope. Create a PAT
#    with repository+package read/write and store it as an Actions secret.
enable-openid-connect: true
name: "Release chart (Reusable)"

on:
  workflow_call:
    inputs:
      chart:
        description: >
          Json encoded list of Helm charts to release. Defaults to releasing everything.
        required: true
        type: string
      createRelease:
        description: >
          Should the chart be published as a Forgejo/Codeberg release
        default: false
        required: false
        type: boolean
      publishToPages:
        description: >
          Should the charts be published to Codeberg Pages.
        default: false
        required: false
        type: boolean
      publishToOciRegistry:
        description: >
          Should the charts be published to an OCI registry.
        default: false
        required: false
        type: boolean

permissions:
  contents: read

jobs:
  release-chart:
    name: Release chart
    runs-on: docker

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout source branch
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          path: src

      - name: Install Mise and required tools
        uses: https://github.com/jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Login to OCI Registry
        if: ${{ inputs.publishToOciRegistry }}
        uses: https://github.com/docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: codeberg.org
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Get chart details
        id: chart-details
        uses: https://github.com/bjw-s-labs/helm-charts-actions/get-chart-details@4f48dbc7967b9c73c1a1f72db82de8de9274a626
        with:
          path: src/charts/${{ inputs.chart }}
          validateChartYaml: true
          requireChangelog: true

      - name: Store chart folder
        id: chart-folder
        shell: bash
        env:
          CHART_DIR: "${{ inputs.chart }}"
        run: |
          TARGET_DIR=$(basename $(dirname ${CHART_DIR}))
          echo "chart_folder=${TARGET_DIR}" >> "$GITHUB_OUTPUT"

      - name: Format changelog
        id: format-changelog
        uses: https://github.com/actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUTS_CHANGES: ${{ steps.chart-details.outputs.changes }}
        with:
          script: |
            let input = process.env.INPUTS_CHANGES ?? '';
            let changelog = "## Changelog:";
            let inputParsed = JSON.parse(input);

            var changelogGrouped = inputParsed.reduce((result, currentValue) => {
              (result[currentValue['kind']] = result[currentValue['kind']] || []).push(currentValue);
              return result;
            }, {});

            for (const key in changelogGrouped) {
              changelog = changelog + `\n### ${key[0].toUpperCase() + key.slice(1)}`;
              let entries = changelogGrouped[key];

              entries.forEach(function (entry) {
                changelog = changelog + `\n- ${entry.description}`;
                if ('links' in entry) {
                  entry.links.forEach(function (link) {
                    changelog = changelog + `\n  - [${link.name}](${link.url})`;
                  });
                }
              });
              changelog = changelog + `\n`;
            }
            core.setOutput('changelog', changelog);

      - name: Dereference JSON schema before packaging
        uses: https://github.com/bjw-s-labs/helm-charts-actions/dereference-json-schema@4f48dbc7967b9c73c1a1f72db82de8de9274a626
        with:
          schemaFile: "src/charts/${{ inputs.chart }}/values.schema.json"
          outputFile: "src/charts/${{ inputs.chart }}/values.schema.json"
          allowFileNotFound: true

      - name: Package Helm Chart
        id: package-chart
        shell: bash
        env:
          CHART_DIR: "src/charts/${{ inputs.chart }}"
          TARGET_DIR: "${{ runner.temp }}/charts_out"
        run: |
          mkdir -p "${TARGET_DIR}"
          helm package "${CHART_DIR}" --dependency-update --destination "${TARGET_DIR}"
          echo "result=$(ls ${TARGET_DIR}/*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Checkout pages branch
        uses: https://code.forgejo.org/actions/checkout@v4
        if: ${{ inputs.publishToPages }}
        with:
          path: pages
          ref: pages

      - name: Copy package to pages structure
        id: copy-package
        if: ${{ inputs.publishToPages }}
        shell: bash
        env:
          CHART_DIR: "${{ inputs.chart }}"
          CHART_FOLDER: ${{ steps.chart-folder.outputs.chart_folder }}
          PACKAGE_FILE: ${{ steps.package-chart.outputs.result }}
        run: |
          TARGET_DIR=$(dirname ${CHART_DIR})
          cp "${PACKAGE_FILE}" "pages/${CHART_FOLDER}/"

      - name: Update repository
        if: ${{ inputs.publishToPages }}
        shell: bash
        working-directory: pages
        run: |
          git pull

      - name: Update Helm chart index
        if: ${{ inputs.publishToPages }}
        shell: bash
        working-directory: pages
        run: |
          helm repo index . --url https://k8s-gateway.codeberg.page/k8s_gateway

      - name: Commit and push changes
        if: ${{ inputs.publishToPages }}
        uses: https://github.com/stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "feat: Add Chart package ${{ steps.chart-details.outputs.name }}-${{ steps.chart-details.outputs.version }}"
          repository: pages
          branch: pages
          file_pattern: "index.yaml *.tgz"
          commit_user_name: forgejo-actions
          commit_user_email: forgejo-actions@noreply.codeberg.org
          commit_author: forgejo-actions <forgejo-actions@noreply.codeberg.org>

      - name: Create tag
        if: ${{ inputs.createRelease }}
        shell: bash
        working-directory: src
        run: |
          TAG="${{ steps.chart-details.outputs.name }}-${{ steps.chart-details.outputs.version }}"
          git tag -f "$TAG"
          git push origin "$TAG" -f

      - name: Create release for tag
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        if: ${{ inputs.createRelease }}
        with:
          direction: upload
          url: https://codeberg.org
          repo: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.chart-details.outputs.name }}-${{ steps.chart-details.outputs.version }}
          release-notes: ${{ steps.format-changelog.outputs.changelog }}
          hide-archive-link: true

      - name: Install Cosign
        if: ${{ inputs.publishToOciRegistry }}
        uses: https://github.com/sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1

      - name: Push Helm charts to OCI registry
        if: ${{ inputs.publishToOciRegistry }}
        shell: bash
        env:
          PACKAGE_FILE: ${{ steps.package-chart.outputs.result }}
          CHART_NAME: ${{ steps.chart-details.outputs.name }}
          CHART_VERSION: ${{ steps.chart-details.outputs.version }}
          CHART_TAG_BASE: codeberg.org/k8s-gateway/charts
          CHART_TAG: ${{ steps.chart-details.outputs.name }}:${{ steps.chart-details.outputs.version }}
          GITHUB_REF: ${{ github.ref }}
        run: |-
          helm push "${PACKAGE_FILE}" oci://${CHART_TAG_BASE} &> push-metadata.txt
          cat push-metadata.txt
          CHART_DIGEST=$(awk '/Digest: /{print $2}' push-metadata.txt)
          cosign sign --yes "${CHART_TAG_BASE}/${CHART_TAG}@${CHART_DIGEST}"
          cosign verify "${CHART_TAG_BASE}/${CHART_TAG}@${CHART_DIGEST}" \
            --certificate-oidc-issuer "https://codeberg.org/api/actions" \
            --certificate-identity "https://codeberg.org/${{ github.repository }}/.forgejo/workflows/chart-release-steps.yaml@${GITHUB_REF}"
