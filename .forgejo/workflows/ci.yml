name: CI

# No `tags` filter: it would have to be satisfied together with `paths`, and a
# tag points at a commit master already tested. Tags are release.yml's job.
on:
  push:
    branches:
      - "master"
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - Makefile
      - .forgejo/workflows/ci.yml
  pull_request:
    branches:
      - "master"
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - Makefile
      - .forgejo/workflows/ci.yml
  workflow_dispatch:

jobs:
  # Linting is in a separate job because golangci-lint is quite slow when
  # running it in cold-start mode.
  lint:
    runs-on: docker
    steps:
      - uses: https://github.com/actions/setup-go@v6
        with:
          go-version: stable
      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: golangci-lint
        uses: https://github.com/golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=15m0s

  unit-test:
    runs-on: docker
    steps:
      - uses: https://github.com/actions/setup-go@v6
        with:
          go-version: stable
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Go module cache
        id: cache-restore
        uses: https://code.forgejo.org/actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Download dependencies
        run: go mod download
      - name: Save Go module cache
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: https://code.forgejo.org/actions/cache/save@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - name: Run tests
        run: make test
      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out ./...
      - name: Upload coverage reports
        uses: https://github.com/codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          use_oidc: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
