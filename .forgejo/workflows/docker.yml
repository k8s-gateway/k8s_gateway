name: Docker release

on:
  push:
    branches: [master]
    paths:
      - cmd/**
      - go.*
      - Dockerfile
    tags:
      - "*"
  pull_request:
    branches: [master]
  release:
    types: [published]

enable-openid-connect: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: amd64
            runner: docker
          - platform: arm64
            runner: docker-arm64
    outputs:
      amd64: ${{ steps.digest.outputs.amd64 }}
      arm64: ${{ steps.digest.outputs.arm64 }}
      image_amd64: ${{ steps.digest.outputs.image_amd64 }}
      image_arm64: ${{ steps.digest.outputs.image_arm64 }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Mint registry JWT
        id: jwt
        if: ${{ github.event_name != 'pull_request' }}
        env:
          AUD: ${{ vars.DOCKER_AUDIENCE }}
        run: |
          [ -n "${AUD}" ] || exit 0
          jwt=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')
          echo "::add-mask::${jwt}"
          echo "jwt=${jwt}" >> "$GITHUB_OUTPUT"

      # PRs push to ttl.sh, which is anonymous, so no login is needed there.
      - name: Login to Codeberg Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: https://github.com/docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: codeberg.org
          username: ${{ github.actor }}
          password: ${{ steps.jwt.outputs.jwt || secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v4

      - name: Build Meta
        uses: https://github.com/docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: codeberg.org/${{ github.repository }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.platform }}
            type=ref,event=pr,suffix=-${{ matrix.platform }}
            type=semver,pattern={{version}},suffix=-${{ matrix.platform }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.platform }}

      - name: Set output type
        id: build-type
        run: |
          case "${{ github.event_name }}" in
            release)
              echo "type=type=image,name=codeberg.org/${{ github.repository_owner }}/k8s_gateway,push-by-digest=true,name-canonical=true,push=true"
              ;;
            pull_request)
              # Anyone can overwrite a ttl.sh tag, so keep the name unguessable.
              # The tag is the image lifetime and 24h is its maximum.
              echo "type=type=image,push=true"
              echo "tags=ttl.sh/$(cat /proc/sys/kernel/random/uuid):24h"
              ;;
            *)
              echo "type=type=docker"
              ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Build Image
        uses: https://github.com/docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          build-args: |
            VENDOR=${{ github.repository_owner }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ github.sha }}
            TARGETPLATFORM=${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=k8s_gateway
            org.opencontainers.image.url=https://codeberg.org/${{ github.repository_owner }}/k8s_gateway
            org.opencontainers.image.version=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
          tags: ${{ steps.build-type.outputs.tags }}
          outputs: ${{ steps.build-type.outputs.type }}
          context: .
          platforms: linux/${{ matrix.platform }}
          provenance: false

      - name: Export Digest
        id: digest
        run: |
          echo "${{ matrix.platform }}=${{ steps.build.outputs.digest }}" >> "${GITHUB_OUTPUT}"
          echo "image_${{ matrix.platform }}=${{ steps.build-type.outputs.tags }}" >> "${GITHUB_OUTPUT}"

  pr-images:
    if: ${{ github.event_name == 'pull_request' }}
    needs: build
    name: PR images
    runs-on: docker
    steps:
      - name: Report pushed images
        run: |
          echo "Images expire 24h after the build."
          echo "docker pull ${{ needs.build.outputs.image_amd64 }}"
          echo "docker pull ${{ needs.build.outputs.image_arm64 }}"

  release:
    if: ${{ github.event_name == 'release' }}
    needs: build
    name: Release
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Mint registry JWT
        id: jwt
        env:
          AUD: ${{ vars.DOCKER_AUDIENCE }}
        run: |
          [ -n "${AUD}" ] || exit 0
          jwt=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')
          echo "::add-mask::${jwt}"
          echo "jwt=${jwt}" >> "$GITHUB_OUTPUT"

      - name: Login to Codeberg Container Registry
        uses: https://github.com/docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: codeberg.org
          username: ${{ github.actor }}
          password: ${{ steps.jwt.outputs.jwt || secrets.REGISTRY_TOKEN }}

      - name: Build Meta
        uses: https://github.com/docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: codeberg.org/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Push Images
        id: push
        uses: https://github.com/Noelware/docker-manifest-action@v1
        with:
          tags: ${{ join(fromJSON(steps.meta.outputs.json).tags, ',') }}
          inputs: >-
            codeberg.org/${{ github.repository_owner }}/k8s_gateway@${{ needs.build.outputs.arm64 }},
            codeberg.org/${{ github.repository_owner }}/k8s_gateway@${{ needs.build.outputs.amd64 }}
          push: false
