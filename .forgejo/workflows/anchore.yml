name: Anchore Grype vulnerability scan

# Scans on image-affecting changes only; the weekly run catches new CVEs in
# otherwise unchanged dependencies.
on:
  push:
    branches: [ "master" ]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - Dockerfile
      - .forgejo/workflows/anchore.yml
  pull_request:
    branches: [ "master" ]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - Dockerfile
      - .forgejo/workflows/anchore.yml
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  Anchore-Build-Scan:
    runs-on: docker
    steps:
    - name: Check out the code
      uses: https://code.forgejo.org/actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag localbuild/testimage:latest
    - name: Run the Anchore Grype scan action
      uses: https://github.com/anchore/scan-action@v7.4.0
      id: scan
      with:
        image: "localbuild/testimage:latest"
        fail-build: false
        severity-cutoff: critical
    - name: Upload vulnerability report
      uses: https://code.forgejo.org/forgejo/upload-artifact@v4
      with:
        name: grype-sarif-report
        path: ${{ steps.scan.outputs.sarif }}
        retention-days: 30
